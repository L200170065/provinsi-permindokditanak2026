<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>Permintaan Data Daerah AMPK — Provinsi</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #f2f8f3; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .loading {
      min-height: 100vh; display: grid; place-content: center; text-align: center;
      padding: 24px; color: #214532; gap: 10px;
    }
    .spinner {
      width: 32px; height: 32px; margin: 0 auto; border: 3px solid #d6eadb;
      border-top-color: #16803d; border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe { display: block; width: 100%; height: 100vh; height: 100dvh; min-height: 640px; border: 0; background: #f2f8f3; }
    @media (max-width: 600px) { iframe { min-height: 100vh; min-height: 100dvh; } }
  </style>
</head>
<body>
  <div class="loading" id="loading" role="status">
    <div class="spinner" aria-hidden="true"></div>
    <strong>Memuat Aplikasi Permintaan Data Daerah AMPK…</strong>
    <span>Mohon tunggu sebentar.</span>
  </div>
  <iframe
    id="app"
    title="Aplikasi Permintaan Data Daerah AMPK Provinsi"
    src="https://script.google.com/macros/s/AKfycby4sXvTRzx67dAJdBCL7PLVRaacjGKcyFKO2X-DIp63jI-6LZQMh7acbVyIniIdUucZlA/exec"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
    onload="document.getElementById('loading').style.display='none'">
  </iframe>
  <noscript>Aktifkan JavaScript pada browser untuk menggunakan aplikasi ini.</noscript>
</body>
</html>
